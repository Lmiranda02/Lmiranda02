<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="LumiDev — Luis Miranda, AI &amp; Automation Specialist">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#E6EDF3" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <linearGradient id="accent" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.75" cy="0" r="0.7">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="300" rx="16" fill="#0A0E14"/>
  <rect width="1200" height="300" rx="16" fill="url(#grid)"/>
  <rect width="1200" height="300" rx="16" fill="url(#glow)"/>
  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="64" y="86" font-size="30" font-weight="700" fill="#E6EDF3">LumiDev <tspan fill="#22D3EE" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace">&gt;_</tspan></text>
    <text x="64" y="132" font-size="16" letter-spacing="4" fill="#22D3EE" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace">&gt; AI &amp; AUTOMATION SPECIALIST</text>
    <text x="64" y="188" font-size="40" font-weight="700" fill="#E6EDF3">Automatizo plataformas educativas</text>
    <text x="64" y="236" font-size="40" font-weight="700" fill="#E6EDF3">con <tspan fill="url(#accent)">datos e IA.</tspan></text>
  </g>
  <g font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="13" fill="#8B98A9">
