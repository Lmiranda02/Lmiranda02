  </g>
  <g transform="translate(880 70)" stroke="#22D3EE" stroke-width="2" fill="none" opacity="0.9">
    <rect x="0" y="0" width="200" height="34" rx="8" fill="#121821" stroke="#1E2836"/>
    <rect x="0" y="56" width="200" height="34" rx="8" fill="#121821" stroke="#1E2836"/>
    <rect x="0" y="112" width="200" height="34" rx="8" fill="#121821" stroke="#1E2836"/>
    <line x1="24" y1="34" x2="24" y2="56" stroke-dasharray="4 5"/>
    <line x1="24" y1="90" x2="24" y2="112" stroke-dasharray="4 5"/>
  </g>
  <g transform="translate(880 70)" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="13" fill="#E6EDF3">
    <text x="16" y="22">SIS → ETL Python</text>
    <text x="16" y="78">Blackboard REST API</text>
    <text x="16" y="134">Reportes · alarmas · IA</text>
